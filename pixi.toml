[workspace]
authors = ["Keith Oshima <koshima789@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "QuinlanLabRotation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
methbat = ">=1.1.0,<2"
samtools = ">=1.24,<2"
bedtools = ">=2.31.1,<3"
python = "*"
polars = ">=2.1.0,<3"
matplotlib-base = ">=3.11.2,<4"
snakemake = ">=9.27.1,<10"

[feature.dev.dependencies]
ruff = "*"
snakefmt = "*"

# https://pixi.prefix.dev/latest/tutorials/multi_environment/#using-multiple-environments-to-test-multiple-versions-of-a-package
[environments]
dev = { solve-group = "prod" }
default = { features = ["dev"], solve-group = "prod" }
